<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Доска объявлений</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            📋 Доска объявлений
        </span>
    </div>
</nav>


<div class="container py-5">

    <!-- Форма добавления объявления -->
    <div class="card shadow-sm mb-5">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Добавить объявление</h4>
        </div>

        <div class="card-body">

            <form id="adForm">

                <!-- Название -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        Название
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        placeholder="Например: Продаю ноутбук"
                        required
                    >
                </div>


                <!-- Описание -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Описание
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        rows="4"
                        placeholder="Напишите описание товара..."
                        required
                    ></textarea>
                </div>


                <!-- Цена -->
                <div class="mb-3">
                    <label for="price" class="form-label">
                        Цена
                    </label>

                    <div class="input-group">
                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            placeholder="30000"
                            min="0"
                            step="0.01"
                            required
                        >

                        <span class="input-group-text">
                            сом
                        </span>
                    </div>
                </div>


                <!-- Фото -->
                <div class="mb-3">
                    <label for="image" class="form-label">
                        Фотография
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="image"
                        accept="image/*"
                        required
                    >
                </div>


                <!-- Кнопка -->
                <button
                    type="submit"
                    class="btn btn-dark"
                    id="submitButton"
                >
                    Опубликовать
                </button>

            </form>


            <!-- Сообщение -->
            <div id="message" class="mt-3"></div>

        </div>
    </div>


    <!-- Список объявлений -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            Все объявления
        </h2>

        <button
            class="btn btn-outline-dark"
            id="refreshButton"
        >
            🔄 Обновить
        </button>

    </div>


    <!-- Здесь JavaScript создаст карточки -->
    <div id="adsList" class="row g-4">

        <div class="col-12 text-center">
            <div class="spinner-border" role="status">
            </div>

            <p class="mt-2">
                Загрузка объявлений...
            </p>
        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Наш JavaScript -->
<script src="script.js"></script>

</body>
</html>
